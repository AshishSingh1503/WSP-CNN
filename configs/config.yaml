# WSP-CNN master config. Every setting here is traceable to PROTOCOL.md.
# Loaded into a frozen Pydantic model (src/utils/config.py); unknown keys are rejected.

paths:                       # relative paths resolve against the repo root
  data_dir: data
  splits_dir: data/splits
  checkpoints_dir: checkpoints
  results_dir: results
  prompts_dir: prompts
  frozen_lock: results/FROZEN_PROTOCOL.lock   # created in Stage 8; its SHA-256 is the test-set token
  features_dir: data/features                 # cached 4096-d penultimate features (E0 warm-up)
  baseline_dir: checkpoints/baseline          # checkpoints/baseline/seed{S}/common_start.pt
  registry: results/checkpoints_registry.json
  model_card: results/model_card.json
  e0_results_dir: results/E0
  finetune_dir: checkpoints/fine_tuning
  e1_results_dir: results/E1
  diag_indices: data/splits/diag_indices.npy
  diag_manifest: data/splits/diag_manifest.json
  examples_dir: results/examples
  faults: configs/faults.yaml
  pc_results_dir: results/PC

data:                        # PROTOCOL.md Section 3
  num_classes: 10
  n_train: 45000
  n_val_edit: 2500
  n_val_select: 2500
  n_official_train: 50000
  n_test: 10000
  split_seed: 2026
  native_image_size: 32
  image_size: 224
  crop_padding: 4
  imagenet_mean: [0.485, 0.456, 0.406]   # fallback if torchvision weights meta is unavailable
  imagenet_std: [0.229, 0.224, 0.225]

loader:
  batch_size_train: 64
  batch_size_eval: 128
  num_workers: 2             # Windows: keep small; 0 is the safe fallback
  pin_memory: true

training:                    # PROTOCOL.md Sections 3-4
  amp: true                  # training only; all evaluation is fp32
  eval_amp: false
  deterministic: true
  warn_only_deterministic: true

model:
  arch: alexnet
  pretrained_weights: IMAGENET1K_V1
  expected_total_params: 57044810   # AlexNet with a 10-class classifier.6

e0:                          # common checkpoint: head-only warm-up on cached features (Stage 2)
  optimizer: adamw
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 256
  schedule: cosine
  trainable_prefixes: ["classifier.6"]
  select_on: val_select      # epoch with best val_select accuracy
  feature_dtype: float16
  agreement_images: 512      # full-model vs cached-feature path check
  min_agreement: 0.995

e1:                          # full fine-tuning reference (Stage 3)
  epochs: 15
  backbone_lr: 0.0001        # seed-0 val_select sweep winner (2026-11-13; see PROTOCOL.md D3)
  classifier_lr: 0.001       # seed-0 val_select sweep winner (2026-11-13; see PROTOCOL.md D3)
  weight_decay: 0.01
  warmup_epochs: 1           # linear warm-up, then cosine to 0 (stepped per batch)
  schedule: cosine
  select_on: val_select
  accum_steps: 1             # raised automatically (and logged) if CUDA runs out of memory
  sweep_seed: 0
  sweep_epochs: 8
  sweep_backbone_lrs: [0.00001, 0.00003, 0.0001]
  sweep_classifier_lrs: [0.0001, 0.001]

budgets:                     # PROTOCOL.md Section 8
  max_iterations: 10
  candidates_per_iteration: 4
  max_candidates: 40
  max_accepted_per_iteration: 1
  edit_budget_fraction: 0.001
  ablation_fractions: [0.00001, 0.0001, 0.001, 0.01]
  max_llm_retries: 1

acceptance:                  # PROTOCOL.md Section 9
  min_loss_decrease: 0.002
  require_accuracy_non_decrease: true
  stop_after_unproductive: 3
  disable_early_stop_for: ["E4", "E5", "E7"]

dsl:                         # Stage 5 edit DSL (supersedes the PROTOCOL.md Section 6 bounds; see Deviations)
  max_ops_per_proposal: 3
  allowed_layers: [features.0, features.3, features.6, features.8, features.10, classifier.1, classifier.4, classifier.6]
  allowed_ops: [add_delta, scale_output_channel, bias_shift, low_rank_update, no_edit]
  add_delta:
    max_indices: 512
    max_abs_delta: 0.05
    rel_value_factor: 0.5    # |delta| <= factor * |current value| + offset
    rel_value_offset: 0.01
  scale_output_channel:
    max_channels: 8
    scale_min: 0.5
    scale_max: 1.5
    allow_zero_channel: false   # if true, a factor of exactly 0.0 is also allowed
  bias_shift:
    max_indices: 16
    classifier_layer: classifier.6
    max_bias_shift_classifier: 1.0
    max_bias_shift_other: 0.2
  low_rank_update:           # delta = sum_i u_i (x) v_i on a rows x cols block of a Linear weight
    max_rank: 4
    max_rows: 32
    max_cols: 64
    max_rel_norm: 0.02       # ||delta||_F <= max_rel_norm * ||W||_F
  limits:
    max_id_chars: 64
    max_reason_chars: 800
    max_text_chars: 400      # expected_effect and risk
    max_evidence_items: 20
    max_evidence_item_chars: 200

controls:
  e4_trials_per_seed: 5
  e4_edits_per_trial: 10
  e5_runs_per_seed: 5
  e7_relative_steps: [0.005, 0.01, 0.02, 0.04]
  e7_max_entries: 64

llm:                         # PROTOCOL.md Section 10 (+ Stage 6 agent settings); provider/model/key come from .env
  provider: anthropic        # overridden by LLM_PROVIDER
  model: claude-opus-5-5     # overridden by LLM_MODEL
  temperature: 0.0           # recorded only: the API rejects temperature/top_p/top_k since 2026-10-21
  send_temperature: false    # set true only for a provider that still accepts it
  effort: medium             # output_config.effort (Opus 5.5 default); thinking itself cannot be disabled
  max_tokens: 16384
  max_api_retries: 5         # rate limit / 5xx / overload, exponential backoff
  backoff_base_seconds: 2.0
  backoff_max_seconds: 60.0
  repair_retries: 1          # one repair retry on invalid JSON, then a failed proposal
  max_calls_per_run: 60      # hard caps per run (real API calls only; cache hits are free)
  max_usd_per_run: 10.0
  cache_dir: results/llm_cache
  prompt_pure: prompts/pure_wsp_v1.md
  prompt_hybrid: prompts/hybrid_wsp_v1.md
  inspect_enabled: true      # read-only weight inspection turns (ablation switch)
  n_inspect: 3
  max_inspect_values: 2048
  inspect_sig_figs: 4
  price_input_per_mtok: 4.0  # USD, claude-opus-5-5 list prices
  price_output_per_mtok: 20.0
  price_cache_read_per_mtok: 0.2
  price_cache_write_per_mtok: 5.0

seeds:
  primary: [0, 1, 2, 3, 4]
  pilot: [100, 101, 102]

stats:                       # PROTOCOL.md Section 12
  n_bootstrap: 10000
  bootstrap_seed: 2026
  alpha: 0.05
  n_primary_claims: 4
  min_effect_pp: 0.3
  min_positive_seeds: 4

diagnostics:                 # Stage 4: diagnostic subset and packet limits (train/val_edit data only)
  diag_per_class: 100        # 1,000 val_edit images
  weight_topk: 3
  dead_threshold: 0.99       # inactive on >= 99% of spatial positions
  sparse_threshold: 0.9      # sparse = inactive fraction in [0.9, 0.99)
  max_listed_channels: 20
  selectivity_layers: [features.11, classifier.4]   # features.10 after ReLU; classifier[4] output
  selectivity_top: 5
  ece_bins: 15
  confusion_top_pairs: 5
  max_misclassified: 20
  grad_topk: 3
  grad_top_pairs: 5
  max_chars: 25000
  sig_figs: 4
  model_name: "AlexNet (ImageNet-pretrained, CIFAR-10 head, 224px input)"
  include_activation_stats: true   # ablation A1 switches this off
  include_weight_stats: true       # ablation A2
  include_confusion: true          # ablation A3

random_search:               # E5 / E6-RS proposal distributions (all within the DSL bounds)
  max_ops: 1                 # operations per random proposal
  param_weight_prob: 0.8     # add_delta targets the weight tensor (else the bias)
  add_delta_max_entries: 32
  add_delta_magnitude: [0.2, 1.0]    # fraction of the per-entry bound
  scale_max_channels: 8
  scale_min_deviation: 0.05          # |factor - 1| at least this
  bias_max_indices: 8
  bias_magnitude: [0.1, 1.0]         # fraction of the layer's bias-shift limit
  low_rank_max_rank: 2
  low_rank_max_rows: 8
  low_rank_max_cols: 16
  low_rank_norm_fraction: [0.2, 0.9] # fraction of the max relative norm
  safety: 0.99                       # stay this fraction inside every bound
  max_sampling_tries: 50

grad_heuristic:              # E7: gradient-heuristic search without an LLM
  top_k_channels: 4
  alphas: [0.05, 0.1, 0.2]
  bias_alphas: [0.05, 0.1, 0.2]      # one per iteration, cycling

random_edit:                 # E4: random editing matched to the E2 edit set (no feedback)
  samples_per_seed: 10
  norm_tolerance: 0.10
  max_attempts: 300
  unit_magnitude: [0.5, 1.0]         # per-entry magnitude fraction before global rescaling

run_all:                     # scripts/run_all.py
  order: [E0, E1, PC, E2, E3, E4, E5, E6, E6_RS, E7]
  llm_steps: [E2, E3, E6, PC]        # steps that call the LLM (PC runs Pure WSP on 3 faults)
  pc_methods: [pure, random, grad]   # PC variants: Pure WSP, E5 and E7 on every fault
  default_minutes:                   # used only until a step has a measured duration
    E0: 4
    E1: 26
    PC: 75
    E2: 15
    E3: 15
    E4: 10
    E5: 8
    E6: 12
    E6_RS: 6
    E7: 10
  progress_file: results/progress.md
  progress_json: results/progress.json
  logs_dir: results/logs/run_all
  stall_minutes: 15          # kill a step whose log has been silent this long (hung data-loader workers)
  poll_seconds: 30
  resumable_steps: [E1]      # steps that can safely restart after a stall (E1 resumes from resume.pt)
  stall_retries: 2

analysis:                    # Stage 9: statistics, tables, figures (everything is generated from files)
  arms: [E0, E1, E2, E3, E4, E5, E6, E6_RS, E7]
  arm_labels: {E0: "E0 common start", E1: "E1 full fine-tune (ref)", E2: "E2 Pure WSP", E3: "E3 Hybrid WSP",
               E4: "E4 random edit", E5: "E5 random search", E6: "E6 last-layer WSP", E6_RS: "E6-RS last-layer random",
               E7: "E7 gradient heuristic"}
  primary:                   # P-d (positive-control repair rate) is tested separately (binomial)
    - {id: P-a, a: E2, b: E0}
    - {id: P-b, a: E2, b: E5}
    - {id: P-c, a: E3, b: E7}
  exploratory:
    - {id: X-1, a: E3, b: E2}
    - {id: X-2, a: E1, b: E0}
    - {id: X-3, a: E2, b: E4}
    - {id: X-4, a: E6, b: E6_RS}
  ci_level: 0.95
  bootstrap_chunk: 250
  tables_dir: results/tables
  figures_dir: results/figures
  # validated reference palette (dataviz skill), fixed per arm so colour follows the entity; E0 is neutral ink
  colors: {E0: "#898781", E1: "#e34948", E2: "#2a78d6", E3: "#eb6834", E4: "#6250d6", E5: "#1baf7a",
           E6: "#e87ba4", E6_RS: "#008300", E7: "#eda100"}
  surface: "#fcfcfb"
  ink: "#0b0b0b"
  ink_secondary: "#52514e"
  grid: "#e1e0d9"

ablations:                   # Stage 9 Part B: validation-only, exploratory; each is a config override of the Pure WSP arm
  seeds: [0, 1, 2]
  arm_prefix: ABL
  defs:
    A1: {method: pure, overrides: {diagnostics.include_activation_stats: false}}
    A2: {method: pure, overrides: {diagnostics.include_weight_stats: false}}
    A3: {method: pure, overrides: {diagnostics.include_confusion: false}}
    A5_conv: {method: pure, allowed_layers: [features.0, features.3, features.6, features.8, features.10]}
    A5_classifier: {method: pure, allowed_layers: [classifier.1, classifier.4, classifier.6]}
    A6_0.001pct: {method: pure, overrides: {budgets.edit_budget_fraction: 0.00001}}
    A6_0.01pct: {method: pure, overrides: {budgets.edit_budget_fraction: 0.0001}}
    A6_1pct: {method: pure, overrides: {budgets.edit_budget_fraction: 0.01}}
    A7_second_llm: {method: pure, env: {LLM_MODEL: claude-sonnet-5-5},
                    overrides: {llm.model: claude-sonnet-5-5, llm.price_input_per_mtok: 2.0, llm.price_output_per_mtok: 10.0,
                                llm.price_cache_read_per_mtok: 0.2, llm.price_cache_write_per_mtok: 2.5}}   # Sonnet 5.5 list prices
    A8_single_step: {method: pure, overrides: {budgets.max_iterations: 1, budgets.max_candidates: 4}}
    A9_no_inspection: {method: pure, overrides: {llm.inspect_enabled: false}}
  references:                # existing arms reused as ablation rows (no new runs)
    A4_pure_vs_hybrid: [E2, E3]
    A6_0.1pct_default: [E2]
